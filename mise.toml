[tools]
opentofu = "1.13.1"
kubectl = "1.37.1"
k9s = "latest"
kapp = "latest"

[env]
# isolated from the default ~/.config/gcloud
CLOUDSDK_CONFIG = "{{env.HOME}}/.config/gcloud-personal"
GOOGLE_APPLICATION_CREDENTIALS = "{{env.CLOUDSDK_CONFIG}}/application_default_credentials.json"
# project: GOOGLE_PROJECT for the tofu google provider, CLOUDSDK_CORE_PROJECT for gcloud
GOOGLE_PROJECT = "lab-gke-2610"
CLOUDSDK_CORE_PROJECT = "{{env.GOOGLE_PROJECT}}"
# repo-local kubeconfig, so cluster contexts don't touch ~/.kube/config
KUBECONFIG = "{{config_root}}/.config/kube/config"
# repo-local k9s config/state, alongside the kubeconfig
K9S_CONFIG_DIR = "{{config_root}}/.config/k9s"
# brew links only gcloud; kubectl also needs gke-gcloud-auth-plugin from the SDK bin dir
_.path = ["/opt/homebrew/share/google-cloud-sdk/bin"]

# repo-local shell history: fc -p swaps the whole in-memory list (not just the
# file, as HISTFILE in [env] would), so global history stays out of up-arrow/ctrl-r here
[hooks.enter]
shell = "zsh"
script = 'fc -p "{{config_root}}/.config/zsh_history"'

[hooks.leave]
shell = "zsh"
script = "fc -P"
