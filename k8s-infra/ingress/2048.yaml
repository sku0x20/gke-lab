apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-2048
  namespace: lb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: apps-group
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /2048
            pathType: Prefix
            backend:
              service:
                name: service-2048
                port:
                  number: 80