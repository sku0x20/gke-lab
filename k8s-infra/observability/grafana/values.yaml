replicas: 1
useStatefulSet: true
service:
  enabled: true
  type: ClusterIP
  port: 80
  headlessService: false
ingress:
  enabled: false
resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
persistence:
  enabled: true
  type: pvc
  size: 10Gi
  accessModes: [ ReadWriteOnce ]
initChownData:
  enabled: false
sidecar:
  alerts:
    enabled: false
  dashboards:
    enabled: false
  datasources:
    enabled: false
  notifiers:
    enabled: false
serviceAccount:
  create: false
rbac:
  create: false
testFramework:
  enabled: false
serviceMonitor:
  enabled: false
imageRenderer:
  enabled: false
networkPolicy:
  enabled: false

grafana.ini:
  paths:
    data: /var/lib/grafana
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    check_for_updates: true
  log:
    mode: console
