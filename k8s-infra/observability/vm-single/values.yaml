global:
  imagePullSecrets: [ ]
  image:
    registry: ""
  compatibility:
    openshift:
      adaptSecurityContext: "auto"
  cluster:
    dnsDomain: cluster.local.

printNotes: true

rbac:
  create: false

serviceAccount:
  create: true
  name:
  automountToken: true
  extraLabels: { }
  annotations: { }

podDisruptionBudget:
  enabled: false

server:
  enabled: true
  name: vm-single
  image:
    registry: ""
    repository: victoriametrics/victoria-metrics
    tag: "" # rewrites Chart.AppVersion
    variant: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: [ ]
  lifecycle: { }
  replicaCount: 1
  priorityClassName: ""
  fullnameOverride:
  retentionPeriod: 1
  extraArgs:
    envflag.enable: true
    envflag.prefix: VM_
    loggerFormat: json
    httpListenAddr: :8428
  extraHostPathMounts: [ ]
  extraVolumes: [ ]
  extraVolumeMounts: [ ]
  extraContainers: [ ]
  initContainers: [ ]
  tolerations: [ ]
  nodeSelector: { }
  affinity: { }
  env: [ ]
  envFrom: [ ]
  containerWorkingDir: ""
  schedulerName: ""

  emptyDir: { }
  persistentVolume:
    enabled: true
    name: ""
    accessModes:
      - ReadWriteOnce
    annotations: { }
    storageClassName: ""
    existingClaim: ""
    matchLabels: { }
    mountPath: /storage
    subPath: ""
    size: 16Gi
  extraLabels: { }
  podLabels: { }
  podAnnotations: { }
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 512Mi
  probe:
    readiness:
      httpGet: { }
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      tcpSocket: { }
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 10
    startup: { }
  securityContext:
    enabled: true
  podSecurityContext:
    enabled: true
  ingress:
    enabled: false

  service:
    annotations: { }
    labels: { }
    clusterIP: "None"
    externalIPs: [ ]
    loadBalancerIP: ""
    loadBalancerSourceRanges: [ ]
    servicePort: 8428
    targetPort: http
    type: ClusterIP
    externalTrafficPolicy: ""
    ipFamilyPolicy: ""
    ipFamilies: [ ]

  mode: statefulSet
  deployment:
    spec:
      strategy:
        type: Recreate
  statefulSet:
    spec:
      podManagementPolicy: OrderedReady
      updateStrategy: { }
  terminationGracePeriodSeconds: 60
  serviceMonitor:
    enabled: false
  relabel:
    enabled: false
  scrape:
    enabled: false

extraObjects: [ ]
