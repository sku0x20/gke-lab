global:
  namespaceOverride: observability
  imagePullSecrets: [ ]
  image:
    registry: ""
  compatibility:
    openshift:
      adaptSecurityContext: "auto"
  cluster:
    dnsDomain: cluster.local.

lifecycle: { }

schedulerName: ""

mode: deployment
deployment:
  spec: { }

image:
  registry: ""
  repository: victoriametrics/vmagent
  tag: "" # rewrites Chart.AppVersion
  variant: ""
  pullPolicy: IfNotPresent

imagePullSecrets: [ ]

nameOverride: ""

fullnameOverride: ""

containerWorkingDir: "/"

rbac:
  create: true
  annotations: { }
  extraLabels: { }
  namespaced: false

serviceAccount:
  create: true
  annotations: { }
  name:
  automountToken: true

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
  labels: { }

remoteWrite:
  - url: http://vm-single-victoria-metrics-single-server:8428/api/v1/write

# -- VMAgent extra command line arguments
extraArgs:
  envflag.enable: true
  envflag.prefix: VM_
  loggerFormat: json
  httpListenAddr: :8429

env: [ ]
envFrom: [ ]
extraLabels: { }
podLabels: { }
extraHostPathMounts: [ ]
extraVolumes: [ ]
extraVolumeMounts: [ ]
extraContainers: [ ]
initContainers: [ ]
podSecurityContext:
  enabled: true
  # fsGroup: 2000
securityContext:
  enabled: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  enabled: true
  annotations: { }
  extraLabels: { }
  clusterIP: ""
  servicePort: 8429
  targetPort: http
  type: ClusterIP
  internalTrafficPolicy: "Local"

ingress:
  enabled: false

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi

annotations: { }
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8429"
nodeSelector: { }
tolerations: [ ]
topologySpreadConstraints: [ ]
affinity: { }
configMap: ""
priorityClassName: ""

serviceMonitor:
  enabled: false
emptyDir: { }

persistentVolume:
  enabled: false

horizontalPodAutoscaling:
  enabled: false

# -- VMAgent scrape configuration
config:
  global:
    scrape_interval: 10s

  scrape_configs:
    - job_name: "kubernetes-apiservers"
      kubernetes_sd_configs:
        - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        server_name: kubernetes
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels:
            [
              __meta_kubernetes_namespace,
              __meta_kubernetes_service_name,
              __meta_kubernetes_endpoint_port_name,
            ]
          action: keep
          regex: default;kubernetes;https
        - action: keep
          source_labels:
            - __meta_kubernetes_service_label_component
          regex: apiserver
      honor_timestamps: false

    - job_name: "kubernetes-nodes-kubelet"
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
      honor_timestamps: false

    - job_name: "kubernetes-nodes-cadvisor"
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      metrics_path: /metrics/cadvisor
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
      # https://github.com/VictoriaMetrics/VictoriaMetrics/issues/4697#issuecomment-1656540535
      honor_timestamps: false


# -- Extra scrape configs that will be appended to `config`
extraScrapeConfigs: [ ]

probe:
  # -- Readiness probe
  readiness:
    httpGet: { }
    initialDelaySeconds: 5
    periodSeconds: 15
  # -- Liveness probe
  liveness:
    tcpSocket: { }
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
  # -- Startup probe
  startup: { }

# -- Add extra specs dynamically to this chart
extraObjects: [ ]

allowedMetricsEndpoints:
  - /metrics

