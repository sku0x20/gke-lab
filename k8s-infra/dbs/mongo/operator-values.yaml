replicaCount: 1

disableTelemetry: false

# createNamespace: false

# set if operator should be deployed in cluster wide mode. defaults to false
watchAllNamespaces: false

# rbac: settings for deployer RBAC creation
rbac:
  create: true

# serviceAccount: settings for Service Accounts used by the deployer
serviceAccount:
  create: true
  annotations: {}

annotations: {}

labels: {}

podAnnotations: {}
  # prometheus.io/scrape: "true"
# prometheus.io/port: "8080"

podLabels: {}

podSecurityContext: {}

securityContext: {}

# set if you want to use a different operator name
# defaults to `percona-server-mongodb-operator`
# operatorName:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  resyncPeriod: 5s

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

logStructured: false
logLevel: "INFO"