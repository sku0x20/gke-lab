apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# sets metadata.namespace on every resource below
namespace: valkey

# added to every resource's metadata.labels; selectors are left alone
labels:
  - pairs:
      app.kubernetes.io/name: valkey

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - service.yaml

# name gets a content hash, so a config change rolls the pod
configMapGenerator:
  - name: valkey-config
    files:
      - valkey.conf
      - cli.sh # admin valkey-cli inside the pod: sh /etc/valkey/cli.sh
