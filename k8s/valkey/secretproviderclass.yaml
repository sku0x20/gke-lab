apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: valkey-acl
spec:
  # Google's provider, installed by the cluster's Secret Manager add-on
  provider: gke
  parameters:
    # fetched with the pod's KSA identity when the pod starts; latest = newest enabled version
    secrets: |
      - resourceName: "projects/lab-gke-2610/secrets/valkey-acl/versions/latest"
        path: "users.acl"
