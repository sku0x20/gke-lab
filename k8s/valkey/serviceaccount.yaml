apiVersion: v1
kind: ServiceAccount
metadata:
  # Workload Identity principal ns/valkey/sa/valkey: infra/dynamic lets it read the valkey-acl secret
  name: valkey
# Valkey never calls the Kubernetes API, so don't mount an API token into the pod.
# the CSI driver gets its own token from the kubelet; this doesn't affect it
automountServiceAccountToken: false
