# listen on all IPv4 and IPv6 addresses; "-" skips IPv6 if the pod has none
# (default is loopback only, unreachable through a Service)
bind * -::*
port 6379

# users and passwords come from a Secret, mounted next to this file
aclfile /etc/valkey/users.acl

# persistence: every write goes to the append-only file on the PVC
dir /data
appendonly yes
# fsync once a second: at most ~1s of writes lost on a crash
appendfsync everysec

# store, not cache: refuse writes when full instead of evicting keys.
# keep at about half the container limit: AOF rewrites fork, and copy-on-write
# can briefly double memory; going over the pod limit gets it OOM-killed
maxmemory 256mb
maxmemory-policy noeviction
