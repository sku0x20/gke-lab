# Long-term fulls, copied by backup-copy.py (a GCS-side copy, no load on mongod):
#   backup-copy          daily    mongo/      -> mongo-full/     newest 90 kept
#   backup-copy-monthly  1st      mongo-full/ -> mongo-monthly/  kept forever
# Why copies: PBM's cleanup deletes whole chains at 7 days, and a second PBM storage would take
# another full backup from mongod. A base is a complete physical backup on its own.
# Both prefixes are outside PBM's (mongo/), so PBM never sees or cleans them; the bucket's
# script itself trims mongo-full/ (KEEP). Idempotent: an already copied base is skipped. Run now with:
#   kubectl -n mongo create job --from=cronjob/backup-copy backup-copy-now
#   kubectl -n mongo create job --from=cronjob/backup-copy-monthly backup-copy-monthly-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-copy
spec:
  schedule: "0 2 * * *" # 2h after the daily base starts (00:00 UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          # same KSA as the agents: its Workload Identity already has the bucket
          serviceAccountName: mongo
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # image's cloudsdk user
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gcloud
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:589.0.0-slim
              command: ["python3", "/scripts/backup-copy.py"]
              env:
                - name: SRC
                  value: gs://lab-gke-2610-mongo-backup/mongo
                - name: DST
                  value: gs://lab-gke-2610-mongo-backup/mongo-full
                - name: KEEP # one copy a day, so ~90 days
                  value: "90"
                - name: CLOUDSDK_CONFIG # gcloud writes its config here; root is read-only
                  value: /tmp/gcloud
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backup-copy # generated from backup-copy.py; kustomize adds the hash
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-copy-monthly
spec:
  schedule: "0 3 1 * *" # 1st of the month, after that day's 02:00 copy to mongo-full/
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          # same KSA as the agents: its Workload Identity already has the bucket
          serviceAccountName: mongo
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # image's cloudsdk user
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gcloud
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:589.0.0-slim
              command: ["python3", "/scripts/backup-copy.py"]
              env:
                - name: SRC
                  value: gs://lab-gke-2610-mongo-backup/mongo-full
                - name: DST
                  value: gs://lab-gke-2610-mongo-backup/mongo-monthly
                - name: CLOUDSDK_CONFIG # gcloud writes its config here; root is read-only
                  value: /tmp/gcloud
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backup-copy # generated from backup-copy.py; kustomize adds the hash
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
