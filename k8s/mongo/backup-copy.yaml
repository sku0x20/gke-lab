# Keeps fulls for 30 days. PBM's cleanup deletes whole chains at 7 days, and a second PBM
# storage would take another full backup from mongod. Instead, copy the newest finished base
# (a complete physical backup on its own) to mongo-full/: a GCS-side copy, no load on mongod.
# mongo-full/ is outside PBM's prefix, so PBM never sees or cleans it; the bucket's lifecycle
# rule deletes it at 30 days. Idempotent: an already copied base is skipped. Run it now with:
#   kubectl -n mongo create job --from=cronjob/backup-copy backup-copy-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-copy
spec:
  schedule: "0 2 * * *" # 2h after the daily base starts (00:00 UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          # same KSA as the agents: its Workload Identity already has the bucket
          serviceAccountName: mongo
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # image's cloudsdk user
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gcloud
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:589.0.0-slim
              command: ["python3", "-c"]
              args:
                - |
                  import json, subprocess, sys

                  SRC = "gs://lab-gke-2610-mongo-backup/mongo"
                  DST = "gs://lab-gke-2610-mongo-backup/mongo-full"

                  def gcloud(*args, check=True):
                      # stdout returned; stderr goes to the pod log
                      return subprocess.run(["gcloud", "storage", *args], check=check,
                                            stdout=subprocess.PIPE, text=True)

                  def is_finished_base(meta):
                      # a base is type incremental with no src_backup
                      return (meta["type"] == "incremental" and not meta.get("src_backup")
                              and meta["status"] == "done")

                  # newest first: backup names are timestamps
                  urls = gcloud("ls", f"{SRC}/*.pbm.json", check=False).stdout.split()
                  for url in sorted(urls, reverse=True):
                      if is_finished_base(json.loads(gcloud("cat", url).stdout)):
                          name = url.rsplit("/", 1)[1].removesuffix(".pbm.json")
                          break
                  else:
                      sys.exit("no finished base")

                  if gcloud("ls", f"{DST}/{name}.pbm.json", check=False).returncode == 0:
                      print(f"{name} already copied")
                      sys.exit()

                  gcloud("cp", "-r", f"{SRC}/{name}", f"{DST}/")
                  # metadata last: its presence marks a complete copy
                  gcloud("cp", f"{SRC}/{name}.pbm.json", f"{DST}/")
                  print(f"copied {name}")
              env:
                - name: CLOUDSDK_CONFIG # gcloud writes its config here; root is read-only
                  value: /tmp/gcloud
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
