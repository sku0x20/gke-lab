apiVersion: v1
kind: ServiceAccount
metadata:
  # Workload Identity principal ns/mongo/sa/mongo: infra/dynamic lets it use the backup bucket.
  # replaces the operator's default ("default"), so no other pod in the ns gets bucket access
  name: mongo
# mongod and pbm-agent never call the Kubernetes API (the operator execs into them).
# GKE's metadata server issues Google tokens on its own, without this token
automountServiceAccountToken: false
