apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mongo
spec:
  # Google's provider; here read by Secret Sync (secretsync.yaml), not mounted into pods
  provider: gke
  parameters:
    # secrets from infra/static/secrets.tf; path = the name secretsync.yaml refers to
    secrets: |
      - resourceName: "projects/lab-gke-2610/secrets/mongo-encryption-key/versions/latest"
        path: "mongo-encryption-key"
      - resourceName: "projects/lab-gke-2610/secrets/mongo-backup-password/versions/latest"
        path: "mongo-backup-password"
      - resourceName: "projects/lab-gke-2610/secrets/mongo-cluster-admin-password/versions/latest"
        path: "mongo-cluster-admin-password"
      - resourceName: "projects/lab-gke-2610/secrets/mongo-cluster-monitor-password/versions/latest"
        path: "mongo-cluster-monitor-password"
      - resourceName: "projects/lab-gke-2610/secrets/mongo-user-admin-password/versions/latest"
        path: "mongo-user-admin-password"
      - resourceName: "projects/lab-gke-2610/secrets/mongo-database-admin-password/versions/latest"
        path: "mongo-database-admin-password"
