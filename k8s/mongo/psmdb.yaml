apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongo # pods: mongo-rs0-0..2
  annotations:
    # backup-base.yaml waits for this group; kapp-config.yaml says when it's done
    kapp.k14s.io/change-group: mongo/cluster
    # the synced Secrets must exist first, or the operator generates its own (random key and
    # passwords) and Secret Sync can't take them over. Create order only: a delete rule would
    # deadlock with the finalizer below (secretsync.yaml)
    kapp.k14s.io/change-rule: "upsert after upserting mongo/secrets"
  # run by the operator on delete, so destroy this app before psmdb-operator
  finalizers:
    - percona.com/delete-psmdb-pods-in-order # secondaries first, primary last
    # data lives one session: also deletes StatefulSets, PVCs and the operator's secrets
    # (keyfile, users copy). The synced ones are left to their SecretSync (secretsync.yaml)
    - percona.com/delete-psmdb-pvc
spec:
  crVersion: 1.23.1 # must match the operator version
  image: percona/percona-server-mongodb:8.0.32-14
  upgradeOptions:
    # operator never changes spec.image itself; upgrade = edit image, deploy
    # (telemetry, still on in the operator, contacts check.percona.com anyway)
    apply: disabled
    # after a major upgrade rolls out, raise featureCompatibilityVersion to it;
    # until then old on-disk formats stay, which is what allows a rollback
    setFCV: true

  secrets:
    # both synced from Secret Manager (secretsync.yaml), so a backup restores into a new cluster
    # system users (clusterAdmin, userAdmin, ...), not app users (spec.users)
    users: mongo-system-users
    # encryption at rest; the default name, spelled out to match secretsync.yaml
    encryptionKey: mongo-mongodb-encryption-key

  # mongo-init copies the entrypoint into each pod; restricted needs these per container
  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  replsets:
    - name: rs0
      size: 3
      # pods run as this KSA; its Workload Identity lets the backup-agent sidecar use the bucket
      serviceAccountName: mongo
      # one member per node (the default; Autopilot adds nodes as needed)
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname
      # setting these replaces the operator's defaults (fsGroup/runAsUser 1001),
      # so they are repeated here
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001 # makes the data volume writable
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        # operator 1.23+ mounts an emptyDir at /tmp when this is set
        readOnlyRootFilesystem: true
      # mongosh writes to $HOME/.mongodb; the operator mounts a writable volume
      # at /.mongodb, but uid 1001's HOME is /home/mongodb (read-only). Without
      # this, mongosh warns on stdout, the operator's primary check fails, and
      # the replset never initializes (upstream #2594, K8SPSMDB-1853)
      env:
        - name: HOME
          value: /
      # Autopilot bills requests: 3 x 500m / 1Gi. 500m is Autopilot's minimum
      # for pods with anti-affinity; lower and GKE Warden rejects the StatefulSet
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 1Gi # WiredTiger cache is sized from this
      volumeSpec:
        persistentVolumeClaim:
          # GKE's default: balanced persistent disk, reclaimPolicy: Delete
          storageClassName: standard-rwo
          resources:
            requests:
              storage: 10Gi

  # plain replica set; upstream example enables sharding
  sharding:
    enabled: false

  # PBM: a backup-agent sidecar in every mongod pod streams backups straight to
  # GCS (nothing staged on disk), as KSA mongo via Workload Identity
  backup:
    enabled: true
    image: percona/percona-backup-mongodb:2.15.0 # paired with operator 1.23.1
    # Autopilot bills every container's requests: 3 x 100m / 256Mi on top of mongod
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi # headroom for compression and upload buffers during a backup
    # setting this replaces the operator's default; runAsNonRoot etc. come from the pod
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true # operator mounts an emptyDir at /tmp (pbm-entry.sh writes tls.pem there)
    storages:
      gcs:
        type: gcs
        gcs:
          bucket: lab-gke-2610-mongo-backup # infra/static
          prefix: mongo
          # no credentialsSecret: PBM falls back to Workload Identity (no keys)
    # oplog slices every 10 min: restore to any second since the newest base.
    # needs a base backup first; starts slicing once one exists
    pitr:
      enabled: true
      oplogSpanMin: 10
    # schedules (UTC) only fire while the cluster is up; a fresh cluster gets its first
    # base from the deploy (backup-base.yaml), or the incrementals have nothing to chain to.
    # deleteFromStorage: false on every task: teardown deletes the backup objects, and
    # that must never delete files in GCS. Rotation: backup-cleanup.yaml
    tasks:
      - name: daily-base
        enabled: true
        schedule: "0 0 * * *"
        type: incremental-base # full physical, starts a new incremental chain
        storageName: gcs
        retention:
          type: count
          count: 2 # Kubernetes objects kept, not files in GCS
          deleteFromStorage: false
      - name: hourly-incremental
        enabled: true
        schedule: "0 1-23 * * *" # skips 00:00, when the base runs (one backup at a time)
        type: incremental # changes since the previous backup in the chain
        storageName: gcs
        retention:
          type: count
          count: 24 # ignored by the operator for incrementals; required to set deleteFromStorage
          deleteFromStorage: false

  # left out on purpose, each is off when omitted (the CRD wants an image
  # even with enabled: false):
  #   logcollector: mongod logs go to stdout (kubectl logs); saves 200m CPU per pod
  #   pmm: no monitoring server
