# Backup rotation: PITR slices kept 48h, backups 7d. Neither PBM nor the operator schedules this.
# PBM's cleanup is chain- and PITR-aware: it keeps a whole chain if the cutoff falls inside it,
# and keeps slices back to the nearest backup, so retention is "at least", never less.
# Runs pbm inside a backup-agent container, which already has the connection and TLS cert.
# Only runs while the cluster is up; the first run of a session catches up. Run it now with:
#   kubectl -n mongo create job --from=cronjob/backup-cleanup backup-cleanup-now
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-cleanup
---
# exec into any pod in the namespace (mongod pods included): a shell there is full DB access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-cleanup
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"] # websocket exec checks both
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-cleanup
subjects:
  - kind: ServiceAccount
    name: backup-cleanup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cleanup
spec:
  schedule: "30 * * * *" # hourly, away from :00 when backups start (PBM runs one operation at a time)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1 # a failed run is retried by the next hour anyway
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: backup-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532 # distroless nonroot
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.4 # matches the server's minor
              # sts/: kubectl picks a running pod, so one restarting member doesn't fail the run
              args:
                - exec
                - statefulset/mongo-rs0
                - --container=backup-agent
                - --
                - bash
                - -ec
                - |
                  pbm delete-pitr --older-than 2d -y --wait
                  pbm cleanup --older-than 7d -y --wait
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
