# Backup rotation: PITR slices kept 48h, backups 7d. Neither PBM nor the operator schedules this.
# PBM's cleanup is chain- and PITR-aware: it keeps a whole chain if the cutoff falls inside it,
# and keeps slices back to the nearest backup, so retention is "at least", never less.
# This pod only queues the command in PBM's control collection; the agents delete the files
# with their own Workload Identity, so no GCS access here.
# Only runs while the cluster is up; the first run of a session catches up. Run it now with:
#   kubectl -n mongo create job --from=cronjob/backup-cleanup backup-cleanup-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cleanup
spec:
  schedule: "30 * * * *" # hourly, away from :00 when backups start (PBM runs one operation at a time)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1 # a failed run is retried by the next hour anyway
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false # never calls the Kubernetes API
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001 # image's mongodb user
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pbm
              image: percona/percona-backup-mongodb:2.15.0 # same as the agents
              command: ["bash", "-ec"]
              args:
                - |
                  # mongod requires a client certificate; same as the agent's pbm-entry.sh
                  cat /etc/mongodb-ssl/tls.key /etc/mongodb-ssl/tls.crt > /tmp/tls.pem
                  pbm delete-pitr --older-than 2d -y --wait
                  pbm cleanup --older-than 7d -y --wait
              env:
                - name: PBM_MONGODB_USER
                  valueFrom:
                    secretKeyRef:
                      name: internal-mongo-users # operator's copy, with URL-escaped values
                      key: MONGODB_BACKUP_USER_ESCAPED
                - name: PBM_MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: internal-mongo-users
                      key: MONGODB_BACKUP_PASSWORD_ESCAPED
                # tlsInsecure: the operator's certs don't cover this client's name; the agents do the same
                - name: PBM_MONGODB_URI
                  value: "mongodb://$(PBM_MONGODB_USER):$(PBM_MONGODB_PASSWORD)@mongo-rs0.mongo.svc.cluster.local:27017/?replicaSet=rs0&tls=true&tlsCertificateKeyFile=/tmp/tls.pem&tlsCAFile=/etc/mongodb-ssl/ca.crt&tlsInsecure=true"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: ssl
                  mountPath: /etc/mongodb-ssl
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: ssl
              secret:
                secretName: mongo-ssl # operator-generated TLS for the replset
            - name: tmp
              emptyDir:
                medium: Memory # holds the client key; never touches disk
                sizeLimit: 1Mi
