apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace and operator come from the psmdb-operator app (deploy it first)
namespace: mongo

resources:
  - serviceaccount.yaml
  - psmdb.yaml
  - backup-base.yaml
  - backup-cleanup.yaml
  - backup-copy.yaml
  - kapp-config.yaml

# name gets a content hash, so a script change updates both CronJobs
configMapGenerator:
  - name: backup-copy
    files:
      - backup-copy.py
