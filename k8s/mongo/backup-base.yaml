# On-demand full physical backup; starts a new incremental chain and gives PITR a base.
# Not in kustomization.yaml: taken by hand, not on deploy. Bases otherwise come only from
# the daily-base task (00:00 UTC), so take one on a new cluster and after a restore:
#   kubectl -n mongo create -f k8s/mongo/backup-base.yaml
# no percona.com/delete-backup finalizer: deleting this object must not delete the files in GCS
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBBackup
metadata:
  generateName: base- # a new object each time
spec:
  clusterName: mongo
  storageName: gcs
  type: incremental-base
