# GKE Secret Sync copies Secret Manager values into these Kubernetes Secrets (same name as the
# SecretSync), so they survive the cluster and a backup restores into a new one.
# The operator reads them instead of generating its own; psmdb.yaml waits for them (kapp).
# Synced once: a new version in Secret Manager does not reach the Secret (no rotation).
#
# The Secret is owned by its SecretSync. Only Secret Sync and the garbage collector may delete it,
# so the operator's delete-psmdb-pvc finalizer gets Forbidden until kapp has deleted the SecretSync.
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: mongo-mongodb-encryption-key # psmdb.yaml spec.secrets.encryptionKey
  annotations:
    kapp.k14s.io/change-group: mongo/secrets
spec:
  serviceAccountName: mongo # reads Secret Manager as KSA mongo (infra/dynamic/iam.tf)
  secretProviderClassName: mongo
  secretObject:
    type: Opaque
    data:
      - sourcePath: mongo-encryption-key
        targetKey: encryption-key # the key the operator mounts as mongod's encryptionKeyFile
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: mongo-system-users # psmdb.yaml spec.secrets.users
  annotations:
    kapp.k14s.io/change-group: mongo/secrets
spec:
  serviceAccountName: mongo
  secretProviderClassName: mongo
  secretObject:
    type: Opaque
    # passwords only: the operator adds the MONGODB_*_USER keys (its default usernames).
    # Secret Sync writes with server-side apply, so it leaves the operator's keys alone
    data:
      - sourcePath: mongo-backup-password
        targetKey: MONGODB_BACKUP_PASSWORD
      - sourcePath: mongo-cluster-admin-password
        targetKey: MONGODB_CLUSTER_ADMIN_PASSWORD
      - sourcePath: mongo-cluster-monitor-password
        targetKey: MONGODB_CLUSTER_MONITOR_PASSWORD
      - sourcePath: mongo-user-admin-password
        targetKey: MONGODB_USER_ADMIN_PASSWORD
      - sourcePath: mongo-database-admin-password
        targetKey: MONGODB_DATABASE_ADMIN_PASSWORD
