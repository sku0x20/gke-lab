# applied to every CRD (target in kustomization.yaml; name here is ignored).
# kapp keeps a copy of each resource in a kapp.k14s.io/original annotation;
# the perconaservermongodbs CRD is ~1.5 MB, over the 256 KiB annotation cap.
# kapp then diffs against the live object instead
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: all-crds
  annotations:
    kapp.k14s.io/disable-original: ""
