apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# operator and the one shared Dragonfly share a namespace, like psmdb-operator
# and mongo; the dragonfly app deploys into it. Moves every upstream object out
# of dragonfly-operator-system (Namespace renamed too). Patches still name
# upstream's dragonfly-operator-system: kustomize matches them before the move
namespace: dragonfly

resources:
  # upstream all-in-one manifest (namespace, CRD, RBAC, Deployment), pinned to
  # a release tag; upgrade = bump the tag. ~480 KB, kept out of the repo
  - https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/v1.7.1/manifests/dragonfly-operator.yaml
  - pdb.yaml

patches:
  - path: crds.patch.yaml
    target:
      kind: CustomResourceDefinition
  - path: namespace.patch.yaml
  - path: operator.patch.yaml
