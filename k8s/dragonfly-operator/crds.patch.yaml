# applied to every CRD (target in kustomization.yaml; name here is ignored).
# kapp keeps a copy of each resource in a kapp.k14s.io/original annotation
# and diffs against it. The dragonflies CRD is ~470 KB, over the 256 KiB
# cap, so kapp silently skips it anyway; this skips it on purpose and
# diffs against the live object instead
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: all-crds
  annotations:
    kapp.k14s.io/disable-original: ""
# the API server's default; upstream omits it, and without an original
# kapp would show it as a removal on every deploy
spec:
  conversion:
    strategy: None
